name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Compile Python sources
        run: python -m compileall -q *.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
          rm -f out_smoke.csv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript
        run: |
          node --check app.js
          node --check staging.mjs
          node tests/test_web_model.mjs

      - name: Verify static entry point
        run: |
          test -f index.html
          test -f styles.css
          grep -q 'id="analyzeBtn"' index.html

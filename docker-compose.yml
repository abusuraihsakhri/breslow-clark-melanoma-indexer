version: '3.8'

services:
  breslow-clark-melanoma-indexer:
    build: .
    container_name: breslow-clark-melanoma-indexer
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=breslow-clark-melanoma-indexer-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
